[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Shutu AI Trading Lab — staged research & trading platform (M0 scope)"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "cryptography>=42",
    # Windows has no system tz database; stdlib zoneinfo requires this
    # package for America/New_York (M1 calendar). Apache-2.0.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
