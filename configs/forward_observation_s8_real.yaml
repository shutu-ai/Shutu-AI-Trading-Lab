# Forward observation preregistration v2 — S8 READ-ONLY REAL shadow window.
#
# PRE-REGISTERED BEFORE ANY REAL OBSERVATION (v2.1 §4.5 discipline).
# This is a SEPARATELY-AUTHORIZED, SEPARATE-VERSION preregistration: the
# synthetic one (configs/forward_observation.yaml, SYNTHETIC_REPLAY_ONLY)
# stays byte-frozen; neither file can ever be "upgraded" in place.
#
# AUTHORITY: user-signed M3.5-S8 approval, 2026-11-22
#   S8_DATA_READ_ONLY=APPROVED_WITH_SCOPE
#   record: artifacts/evidence/M3.5/s8/authorization-check.md
#   scope: Alpaca free Basic/IEX feed, <= 3 US equity/ETF symbols,
#          READ-ONLY (no Paper/Live order of any kind; PAPER_WRITE
#          stays NOT_AUTHORIZED), $0 budget, no paid upgrades.
#
# UNCHANGED ELSEWHERE: BLOCKED_DATA (full-market historical research),
# M1 U-1 closed vocabularies (fixed, not unlocked), S=INCONCLUSIVE,
# R=NOT_STARTED, BROKER_BEHAVIOR_UNVERIFIED, SEALED_NOT_MATERIALIZED.

schema: forward-observation-preregistration-v2
forward_protocol_id: m35-s8-real-shadow-readonly-v1
mode: REAL_SHADOW_READ_ONLY
description: >
  S8 read-only real market-data shadow window: a frozen transparent B2
  rule locks predictions BEFORE real observations arrive; events are
  idempotent; restarts and crash recovery are exactly-once; the forward
  journal and the collector receipt chain are append-only hash chains
  with external anchors, cross-verified (every consumed event must bind
  to a real receipt). Real arrivals are daily completed bars received
  after the ET session close from the Alpaca Basic/IEX feed.

environment_must_equal: REAL_SHADOW_READ_ONLY

# ---------------------------------------------------------------------------
# source authorization — the permission switches (signed approval scope)
# ---------------------------------------------------------------------------
source_authorization:
  real_market_data: ALPACA_IEX_BASIC_READ_ONLY
  provider: alpaca
  feed: iex                       # free Basic feed; SIP is NOT authorized
  plan: basic_free                # $0 — paid upgrades are never authorized
  broker_credentials: FORBIDDEN   # no trading API use of any kind
  vendor_capability_claims_accepted: false   # M1 U-1 stays closed
  admitted_sources: [alpaca_iex]
  license_attestation:
    operator_confirmed: true      # account owner confirms license/feed/
                                  # credential setup personally (approval §3)
    approval_record: artifacts/evidence/M3.5/s8/authorization-check.md
    scope: personal_engineering_shadow_only

# ---------------------------------------------------------------------------
# strategy lineage — the SAME frozen B2 rule as the synthetic prereg
# (parameters were selected once, in M3-R2, and frozen; no forward result
# may feed back into selection)
# ---------------------------------------------------------------------------
lineage:
  parent_identity_schema: research-code-identity-v1
  parent_code_hash: af7ff10c425c0f153b2e7c1d1a86c6185267438610a81fa39a268a0f8d15f611
  parent_runner: scripts/run_m3_r2_baselines.py
  parent_protocol_id: m3-synthetic-engineering-v2
  parent_protocol_hash: 8afb5207819bcd51ee66072f95d85355ed91b0e73d52e8ed24cc3fcd1ed43901
  synthetic_sibling:
    preregistration: configs/forward_observation.yaml
    note: >
      Byte-frozen synthetic sibling (protocol m35-shadow-synthetic-replay-v1).
      Real-arriving evidence NEVER upgrades the synthetic run, and the
      synthetic run never back-fills this window.

strategy:
  arm: B2_single_rule
  rule: >
    Transparent MA cross: hold (LONG) while MA(short_n) > MA(long_n),
    FLAT otherwise; decisions use only closes with
    ts_available <= decision_at (PIT gate).
  short_n: 2
  long_n: 4
  warmup_bars: 4                  # = long_n; no predictions before warmup
  prediction_content: exposure decision (LONG/FLAT) + reference close digest
  scoring_rule: >
    A LONG slot scores HIT when the observation event's close is strictly
    above the locked reference close, MISS when strictly below, and FLAT
    when equal; a FLAT slot scores NO_CLAIM (no directional claim was
    made). Verdicts are engineering stability counters only — never alpha.

# ---------------------------------------------------------------------------
# admitted real dataset (receipt-content admission — no preregisterable
# fixture hash exists for live-arriving data; traceability is the
# collector's receipt chain, cross-verified against the forward journal)
# ---------------------------------------------------------------------------
admitted_datasets:
  - name: m35-s8-real-iex-shadow-v1
    source: alpaca_iex
    symbols: [SPY, QQQ]           # <= 3 per the signed approval; start at 2
    interval: 1d
    dataset_admission: receipt_content_hash
    feed_restriction: iex_only

# ---------------------------------------------------------------------------
# event contract and ordering
# ---------------------------------------------------------------------------
event_contract:
  required_fields: [event_id, source, dataset_hash, symbol, interval,
                    ts_event, ts_available, received_at, close]
  timestamps_tz_aware: true
  available_not_before_event: true        # ts_available >= ts_event
  ordering: per-source ts_event non-decreasing
  duplicate_policy: IDEMPOTENT_SAME_PAYLOAD_REJECT_DIFFERENT
  duplicate_identity_fields: [event_id, source, dataset_hash, symbol,
                              interval, ts_event, ts_available, close]
  event_id_rule: alpaca_iex:{SYMBOL}:1d:{session_date}
  # a re-poll of the same session is an IDEMPOTENT duplicate; a vendor
  # revision of the same bar (same id, different payload) is a CONFLICT
  # that conservatively suspends scoring (audited, never auto-merged).
  ttl:
    max_events_wait: 2        # slot expires if 2 admitted events pass
                              # without its same-symbol observation
                              # (daily bars: SPY/QQQ alternate)
    max_synthetic_seconds: 864000   # 10-day scheduling horizon for the
                                    # future-stamp guard (key name kept
                                    # for engine compatibility)
  environment_mismatch: REJECT          # any other claimed environment

# ---------------------------------------------------------------------------
# market clock — OPERATOR-DECLARED real calendar table (never inferred
# from a fixture). Sources: NYSE published calendar rules as of the
# freeze date (DOCUMENTED evidence tier; re-verify against the exchange
# circular before the first collected session):
#   - Thanksgiving Day close:      Thu 2026-11-26 (holiday)
#   - day after Thanksgiving:      Fri 2026-11-27, 13:00 ET early close
#   - Christmas Day:               Fri 2026-12-25 (holiday)
#   - Christmas Eve:               Thu 2026-12-24, 13:00 ET early close
#   - New Year's Day 2027:         Fri 2027-01-01 (holiday)
# Collection outside the coverage window refuses to run (new prereg
# version required) — no invented calendar assumptions.
# ---------------------------------------------------------------------------
market_clock:
  validate: true
  calendar_source: OPERATOR_DECLARED_TABLE
  calendar_valid_from: "2026-11-23"
  calendar_valid_until: "2027-01-08"
  holidays: ["2026-11-26", "2026-12-25", "2027-01-01"]
  half_days: ["2026-11-27", "2026-12-24"]
  session_window_et: ["09:30", "16:00"]
  daily_bar_normalization: SESSION_CLOSE_ET
  note: >
    A daily bar's vendor timestamp maps to its ET session date; the event
    ts_event is that session's DST-correct close instant (13:00 ET on a
    declared half day, 16:00 otherwise). ts_available is the REAL receipt
    time — the collector never claims a vendor publish time it cannot
    prove (conservative PIT).

# ---------------------------------------------------------------------------
# collection schedule and transport (the read-only guard surface)
# ---------------------------------------------------------------------------
collection:
  poll_window_et: ["16:05", "17:30"]   # completed daily bars, after close
  poll_interval_seconds: 60
  poll_timeout_seconds: 20
  transport:
    scheme: https
    allowed_hosts: [data.alpaca.markets]
    allowed_paths:
      - "^/v2/stocks/[A-Z]{1,5}/bars/latest$"
    methods: [GET]
    redirects: forbidden
    body: forbidden
    credential_headers: [APCA-API-KEY-ID, APCA-API-SECRET-KEY]
    # trading-API hosts (api.alpaca.markets / paper-api.alpaca.markets)
    # are structurally unreachable: rejected by the client guard on every
    # request, refused by the preregistration loader, and banned in the
    # gateway plane rules (static architecture check).

# ---------------------------------------------------------------------------
# journaling — forward journal (unchanged daemon mechanism) + receipt chain
# ---------------------------------------------------------------------------
journal:
  backbone: security.audit.AuditLog
  head_record: true
  anchor_file: journal-anchor.json
  receipt_chain: receipts.jsonl   # provider/feed/symbol/event_id/vendor
                                  # ts/received_at/payload digest/protocol
                                  # hash/collector code hash per message;
                                  # transport failures and quality rejects
                                  # receipt-logged the same way (failed
                                  # evidence is evidence — never deleted)
  scoring_exactly_once: >
    A SCORED entry in the chain is the persistent scored record; rebuilds
    refuse to score a slot twice, and a stored observation without a score
    is completed exactly once on recovery.

# ---------------------------------------------------------------------------
# real forward window (task S8) — preregistered BEFORE first collection
# ---------------------------------------------------------------------------
real_window:
  enabled: true                   # ONLY the real version enables this
  min_trading_days: 5             # REAL observable US sessions (signed
  # approval condition 5); insufficient observation may NOT claim a full
  # E-Gate PASS — it stays PENDING_FORWARD_WINDOW / ACCUMULATING.
  day_counting_rule: full_coverage   # a day counts only when EVERY
  # admitted symbol delivered a validated bar for that session; partial
  # days are disclosed in the denominators, never counted toward the
  # threshold.
  requirements:
    - real-arrived events with prediction_locked_at < observation_available_at
      from the arrival records themselves (receipt chain cross-verified)
    - at least one disconnect/restart recovery and one duplicate-event
      recovery inside the real window
    - "zero unauthorized broker orders; zero duplicate broker orders
      (structurally enforced: no broker write path exists in the S8 plane)"
    - full replay/identity/data-quality audits passing
  paper_orders: PAPER_NOT_RUN     # no Paper authorization in this stage
  operator_gate:
    authorization_token: S8_APPROVAL_20261122
    authorization_record: artifacts/evidence/M3.5/s8/authorization-check.md
    credentials: operator-injected market-data credentials (collector
      process env only; values never logged, receipted, or committed)
    missing_credentials_state: BLOCKED_ENV
eligibility_states:
  - OFFLINE_HARNESS_PASS_WITH_SCOPE   # fixture/selftest proof only
  - BLOCKED_ENV                        # environment blocks collection
  - BLOCKED_DATA                       # no legal data access
  - PENDING_FORWARD_WINDOW             # real window accumulating, not full
  - PASS                               # full M3.5 forward E-Gate (real 5 days)
