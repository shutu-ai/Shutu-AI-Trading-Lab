# M3 frozen evaluation protocol v1 — pre-registered BEFORE any experiment.
#
# GOVERNANCE (M3-R1-T2):
# - The protocol_hash is the canonical digest (security.canonical) of this
#   whole parsed payload. ANY change to ANY field below produces a new hash
#   = a new protocol version; there is no in-place threshold edit.
# - Runtime mutation of a loaded protocol is refused (frozen object).
# - Gates marked NOT_SETTABLE have no defensible numeric basis in the M3
#   synthetic scope; any experiment verdict that would depend on them must
#   be reported INCONCLUSIVE, never PASS.
# - The former stub's `max_drawdown_pct: 100` was an unbounded non-gate and
#   is deliberately ABSENT: arms REPORT drawdown/tail metrics, but no fake
#   risk filter is claimed. Synthetic results are engineering proofs only.

schema_version: 1
protocol_id: m3-synthetic-engineering-v2
protocol_version: 2
canonical_rule: sorted_keys_utf8_no_whitespace
description: >
  M3 synthetic engineering validation, v2 batch registry (M3-R2): B0 cash,
  B1 ETF buy-and-hold, B2 transparent single-rule strategy. OFFICIAL
  engineering runs require the pre-registered sample gate
  (validation.min_bars) SATISFIED before any engineering verdict is
  issued; the 20-bar r1 dataset stays registered as SYNTHETIC_SMOKE_ONLY
  legacy evidence and can never back a min_bars PASS. Synthetic data only
  — results are engineering proofs (conservation/PIT/determinism/cohort
  hygiene), NOT alpha, NOT OOS, NOT deployable evidence.

data_scope: SYNTHETIC_ENGINEERING_ONLY
max_claimable_evidence: ENGINEERING_ONLY

seeds: [42, 137, 2026]

decimal_tolerance: "0.0001"

# Cost model (sensitivity: run every arm at cost_multipliers x1/x2/x3)
cost_model:
  commission_per_trade: "1.00"
  spread_pct: "0.001"
  slippage_pct: "0.0005"

cost_multipliers: [1, 2, 3]

# Execution model (identical semantics for ALL arms)
execution:
  order_delay_bars: 1          # signal at close T, execute at open T+1 at the earliest
  allow_same_day_close: false  # a close-formed signal may never fill at that same close
  volume_limit_pct: 0.10       # max 10% of bar volume per order
  partial_fill_threshold_pct: 0.50  # below 50% of requested size => partial-fill event
  settlement_days: 2           # T+2 cash settlement (protocol assumption, NOT a broker guarantee)

# Point-in-time constraint
pit_rule: available_at <= decision_at

# Gates. SET = binding, testable, enforced. NOT_SETTABLE = no defensible
# numeric basis now; dependent verdicts are INCONCLUSIVE by construction.
gates:
  conservation:
    status: SET
    description: cash/shares/fees conservation on every event; fail closed
  pit:
    status: SET
    description: available_at <= decision_at on every consumed fact
  determinism:
    status: SET
    description: same seed + protocol_hash + dataset_hash + code_hash => identical output digest within decimal_tolerance
  statistical_alpha:
    status: NOT_SETTABLE
    verdict: INCONCLUSIVE
    reason: >
      No effect size / significance / sample-power basis exists for
      synthetic fixtures. Alpha statistics are registered (multiplicity
      ledger) but cannot PASS in M3; they may only support
      HIST_OOS_SUPPORTED claims once REAL admitted data exists, and even
      then never Live eligibility.

# Engineering acceptance thresholds (binding in synthetic scope)
validation:
  min_bars: 100
  min_trades_for_stats: 10
  require_conservation_check: true
  require_pit_check: true
  require_determinism_check: true

# Arms: v2.1 §4.3 definitions, frozen. M3 executes B0–B2 ONLY; B3–B8 are
# registered definitions with fair-comparison budget rules — no shell code.
arms:
  B0_cash:
    description: "Hold cash for the full window; baseline return 0 (cash yield per this protocol: none registered — reported as 0.0, not fabricated)"
    budget_trials: 1
    enabled: true
  B1_buy_hold:
    description: "Buy-and-hold synthetic broad ETF; dividends and splits applied via corporate-action events; full cost model"
    budget_trials: 1
    enabled: true
  B2_single_rule:
    description: "One pre-declared transparent MA-cross rule; parameters selected on Train/Validation ONLY, then frozen before OOS"
    budget_trials: 1
    enabled: true
  B3_regime:
    definition: "B2 + a pre-registered regime filter (state labels from the SAME snapshot boundary); isolates regime-filter increment"
    budget_trials: null
    enabled: false
  B4_multi_static:
    definition: "Fixed-weight multi-strategy, no regime use; isolates static diversification increment"
    budget_trials: null
    enabled: false
  B5_regime_routing:
    definition: "B4 + regime routing, no strategy evolution; isolates routing increment"
    budget_trials: null
    enabled: false
  B6_ai_champion:
    definition: "B5 + Champion–Challenger with AI strategy discovery; isolates strategy-evolution net value"
    budget_trials: null
    enabled: false
  B7_rule_search:
    definition: "Identical routing/evolution rules as B6 but rule/limited search only; isolates AI-vs-rules increment under EQUAL budgets"
    budget_trials: null
    enabled: false
  B8_rebalance:
    definition: "Simple periodic rebalance / risk-budget portfolio; tests whether low-cost allocation alone suffices"
    budget_trials: null
    enabled: false

# Budgets — both views are STRUCTURES, not boolean flags (v2.1 §4.3: two
# `true`s are not fairness). The trial ledger (validation.ledger) enforces
# these fail-closed; failures and retries bill like successes.
budget:
  max_total_trials: 100
  max_search_queries: 200
  max_failures_before_halt: 20
  max_hypotheses: 50
  max_holdout_unlocks: 1
  max_llm_usd: "0.00"       # M3 synthetic consumes no LLM budget
  max_compute_hours: "4.0"
  failure_retry_billing: ALL_BILLED
  equal_trial_budget:
    per_arm_trials:
      B0_cash: 3
      B1_buy_hold: 3
      B2_single_rule: 3
    count_failures: true
    count_retries: true
    note: >
      Primary causal budget. Every registered run — success, failure,
      retry, cancelled — consumes one trial from the SAME per-arm budget.
      Per-arm budget = 3 = one official run per cost multiplier (x1/x2/x3)
      at the first protocol seed; determinism across seeds is enforced by
      the automated test suite and is NOT extra billable trials.
  equal_economic_budget:
    status: NOT_APPLICABLE_YET
    llm_usd_cap: "0.00"
    compute_hours_cap: "4.0"
    data_amortization_usd_cap: "0.00"
    human_intervention_minutes_cap: 0
    note: >
      Honest scoping: dollar-parity binds only when AI arms (B6/B7)
      activate in M4+. In M3 the arms consume no LLM/human budget, so a
      dollar-parity claim would be vacuous; the trial ledger is the only
      fairness instrument. Registered now so the M4 comparison inherits
      one frozen definition.

# Multiplicity / multiple-comparison policy
multiplicity:
  register_all_trials: true
  policy: >
    All trials (success/failure/retry/incomplete), parameter combinations
    and queries are registered in the experiment ledger with code,
    protocol and dataset hashes. Multiplicity is reported by ACTUAL
    registered counts. Correction methods (Deflated Sharpe, PBO,
    Bootstrap/Reality Check) are applied only when the method fits the
    sample structure; otherwise the report states the raw count and
    INCONCLUSIVE — never an uncorrected PASS.

# M3-R2 batch registry — experiment lineage is FIRST-CLASS governance.
# History is append-only across protocol versions: a legacy batch keeps
# its restricted status and consumed budget; no batch may be cleared,
# renamed or re-counted into another batch's ledger.
experiment_batches:
  m3-r1-batch-1:
    status: SYNTHETIC_SMOKE_ONLY_LEGACY
    sample_gate: INSUFFICIENT_SAMPLE
    dataset_bars: 20
    dataset_hash: 441980e3a64a5494fa90376dd23edf10ca79a777984f9bc1469225491d0eb435
    protocol_revision: v1.1
    protocol_hash: 48dee8613dd727b3fce04230851c75062c9a6e85e634709d8bab09df1cf6ed83
    code_hash_scope: RUNNER_ONLY_LEGACY
    code_hash: c0a9ede5bf4dea02e5a4141f3a494c29291039d678ed3aae2380619d510a8d0f
    ledger: artifacts/evidence/M3/r1/experiment-ledger.jsonl
    consumed_budget:
      queries: 4
      trials: 9
      per_arm_trials:
        B0_cash: 3
        B1_buy_hold: 3
        B2_single_rule: 3
    verdict: INSUFFICIENT_SAMPLE_SMOKE_ONLY
    note: >
      The r1 official run predates the sample-gate enforcement and the
      full code identity. Its 20-bar evidence remains valid ONLY as
      functional smoke proof (SYNTHETIC_SMOKE_ONLY); it never satisfies
      validation.min_bars=100 and never backs an official engineering
      PASS. Its ledger file is read-only history.
  m3-r2-batch-1:
    status: OFFICIAL_SYNTHETIC_ENFORCE_SAMPLE_GATE
    dataset_bars_min: 100
    ledger: artifacts/evidence/M3/r2/experiment-ledger.jsonl
    code_hash_scope: FULL_RESEARCH_MANIFEST
    per_arm_trials: 3
    budget_note: >
      Fresh equal-trial budget for this batch (one official run per cost
      multiplier x1/x2/x3 at the first protocol seed). The r1 batch's
      9 trials + 4 queries stay registered in their own ledger and are
      NOT erased, renamed, or re-counted as r2 runs; family-cumulative
      consumption is disclosed in
      artifacts/evidence/M3/r2/protocol-change-and-budget.md.

# M9 one-shot final Holdout — candidate-selection rule pre-registered NOW.
# Real market data is BLOCKED_DATA in M3: nothing is materialized, and no
# sample IDs / dataset hashes may be fabricated.
holdout:
  status: SEALED_NOT_MATERIALIZED
  sample_ids: null
  dataset_hash: null
  max_unlocks: 1
  unlock_policy: M9_ONLY_INDEPENDENT_GOVERNANCE
  strategy_family: transparent-single-rule-and-baselines
  candidate_selection_rule: >
    At M8 end, BEFORE any M9 unlock, an independent governance process
    selects the UNIQUE candidate: highest Validation-set net return at
    cost multiplier x2 among candidates passing ALL SET engineering gates
    (conservation, PIT, determinism) and cohort hygiene; tie-break by
    lower turnover; the chosen strategy_hash/build hash is irreversibly
    frozen with an audit event. Selection may never see the holdout
    itself, and after the first unlock no re-selection or re-test is
    permitted for the same strategy family.
  verdict_states: [PASS, FAILED, INCONCLUSIVE, INVALIDATED]
  pollution: >
    First unlock emits an immutable HoldoutAccess event and sets
    polluted_for_future_selection=true; subsequent unlocks and subsequent
    champion selections are refused unconditionally.
  access: >
    Research roles: no direct read, no statistical aggregation, no
    query differencing, no repeated probing — all refused and audited.
    (M3 enforces this at the application boundary; OS-level sandboxing
    belongs to M4.)
