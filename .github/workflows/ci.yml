name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Environment check
        run: python scripts/check_environment.py
      - name: Tests (contracts + security + no_lookahead)
        run: pytest
      - name: Architecture boundary check
        run: python scripts/check_architecture.py
      - name: Secret leak scan
        run: python scripts/scan_secrets.py
      - name: Paper runtime live-artifact gate
        run: python scripts/verify_live_blocked.py
